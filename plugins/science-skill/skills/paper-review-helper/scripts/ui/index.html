<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper Review</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/contrib/auto-render.min.js"></script>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1c2330; --muted: #5f6b7a; --line: #e2e6ec;
  --accent: #2f6fed; --accent-ink: #ffffff; --accent-soft: #e8f0ff;
  --major: #c92a2a; --major-soft: #fde8e8; --minor: #b7791f; --minor-soft: #fff4dc;
  --done: #2b8a3e; --open: #2f6fed; --pending: #b6bec9;
  --mk-g: #b7791f; --mk-c: #6741d9; --mk-q: #c92a2a; --mk-ref: #0b7285; --mk-eq: #862e9c;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .1);
  --radius: 10px; --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161d; --panel: #1a2029; --ink: #e6eaf0; --muted: #98a3b3; --line: #2b3441;
    --accent: #6d9cff; --accent-ink: #0d1523; --accent-soft: #1e2b45;
    --major: #ff6b6b; --major-soft: #3a1f22; --minor: #f4b942; --minor-soft: #3a3020;
    --done: #51cf66; --open: #6d9cff; --pending: #4b5563;
    --mk-g: #f4b942; --mk-c: #b197fc; --mk-q: #ff6b6b; --mk-ref: #63e6be; --mk-eq: #da77f2;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"] {
  --bg: #12161d; --panel: #1a2029; --ink: #e6eaf0; --muted: #98a3b3; --line: #2b3441;
  --accent: #6d9cff; --accent-ink: #0d1523; --accent-soft: #1e2b45;
  --major: #ff6b6b; --major-soft: #3a1f22; --minor: #f4b942; --minor-soft: #3a3020;
  --done: #51cf66; --open: #6d9cff; --pending: #4b5563;
  --mk-g: #f4b942; --mk-c: #b197fc; --mk-q: #ff6b6b; --mk-ref: #63e6be; --mk-eq: #da77f2;
  --shadow: 0 1px 2px rgba(0,0,0,.4);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
header {
  position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px;
  padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
}
header h1 { font-size: 16px; margin: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 500; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.pill.waiting-you { background: var(--minor-soft); color: var(--minor); }
.pill.waiting-you .dot { animation: pulse 1.2s infinite; }
.pill.offline { background: var(--major-soft); color: var(--major); }
.pill.working .dot { animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
.counts { display: flex; gap: 6px; }
.chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; font-weight: 600; }
.chip.major { background: var(--major-soft); color: var(--major); }
.chip.minor { background: var(--minor-soft); color: var(--minor); }
.app { display: grid; grid-template-columns: 240px minmax(0, 1fr) 400px; gap: 0; height: calc(100vh - 53px); }
.sidebar, .panel { background: var(--panel); overflow-y: auto; }
.sidebar { border-right: 1px solid var(--line); padding: 12px 8px; }
.panel { border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.content { overflow-y: auto; padding: 24px 32px 80px; }
.sidebar h2, .panel h2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 6px 8px 8px; }
.outline { list-style: none; margin: 0; padding: 0; }
.outline li { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 8px; cursor: pointer; color: var(--muted); font-size: 14px; }
.outline li.level-2 { padding-left: 24px; font-size: 13px; }
.outline li:hover { background: var(--bg); }
.outline li.selected { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.outline li.posted { color: var(--ink); }
.outline li.skip { opacity: .5; text-decoration: line-through; }
.outline .st { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--pending); }
.outline .st.open { background: var(--open); box-shadow: 0 0 0 3px var(--accent-soft); }
.outline .st.done { background: var(--done); }
.outline .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.outline .n { font-size: 11px; color: var(--muted); }
.outline .badge { font-size: 11px; font-weight: 600; padding: 0 6px; border-radius: 999px; background: var(--bg); color: var(--muted); }
.outline .badge.has { background: var(--major-soft); color: var(--major); }
.empty { color: var(--muted); text-align: center; padding: 60px 20px; }
.empty .big { font-size: 32px; margin-bottom: 8px; }
.sec-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.sec-head h2 { font-size: 24px; margin: 0; }
.sec-head .src { color: var(--muted); font-size: 12.5px; font-family: var(--mono); }
.sec-head .status { font-size: 12px; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--muted); margin: 0 0 18px; }
.legend .mk { cursor: default; }
.doc { max-width: 78ch; font-size: 16px; line-height: 1.7; }
.doc h1, .doc h2, .doc h3 { line-height: 1.25; margin-top: 1.4em; }
.doc h1 { font-size: 1.5em; } .doc h2 { font-size: 1.3em; } .doc h3 { font-size: 1.1em; }
.doc p { margin: 0 0 1em; }
.doc img { max-width: 100%; border-radius: 6px; border: 1px solid var(--line); cursor: zoom-in; }
.doc pre { background: var(--bg); padding: 12px; border-radius: 8px; overflow-x: auto; font-size: 13px; }
.doc code { font-family: var(--mono); font-size: .92em; }
.doc blockquote { margin: 0 0 1em; padding: 0 0 0 14px; border-left: 3px solid var(--line); color: var(--muted); }
.doc table { border-collapse: collapse; margin-bottom: 1em; } .doc td, .doc th { border: 1px solid var(--line); padding: 4px 8px; }
.doc .katex-display { overflow-x: auto; overflow-y: hidden; padding: 4px 0; }
.mk { display: inline; padding: 1px 6px; border-radius: 5px; font-size: .86em; font-weight: 600; cursor: pointer; white-space: normal; border: 1px solid transparent; }
.mk:hover { filter: brightness(.95); border-color: currentColor; }
.mk-G { background: color-mix(in srgb, var(--mk-g) 16%, transparent); color: var(--mk-g); }
.mk-C { background: color-mix(in srgb, var(--mk-c) 16%, transparent); color: var(--mk-c); }
.mk-Q { background: color-mix(in srgb, var(--mk-q) 16%, transparent); color: var(--mk-q); }
.mk-REF { background: color-mix(in srgb, var(--mk-ref) 16%, transparent); color: var(--mk-ref); }
.mk-EQ { background: color-mix(in srgb, var(--mk-eq) 16%, transparent); color: var(--mk-eq); }
.mk .k { opacity: .75; margin-right: 3px; }
.figs { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; margin-top: 24px; }
.fig { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
.fig img { display: block; width: 100%; max-height: 260px; object-fit: contain; background: #fff; cursor: zoom-in; }
.fig .cap { padding: 8px 10px; font-size: 12.5px; color: var(--muted); }
.fig .cap p { margin: 0; }
.fig .cap strong { color: var(--ink); }
.ref { font-size: .85em; color: var(--muted); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; white-space: nowrap; }
.tabs { display: flex; border-bottom: 1px solid var(--line); flex: none; }
.tabs button { flex: 1; background: none; border: 0; padding: 10px; color: var(--muted); font-weight: 600; font-size: 13px; cursor: pointer; border-bottom: 2px solid transparent; }
.tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab { display: none; flex: 1; min-height: 0; flex-direction: column; }
.tab.active { display: flex; }
.thread { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 92%; padding: 8px 12px; border-radius: 12px; font-size: 14px; line-height: 1.5; }
.msg.assistant { align-self: flex-start; background: var(--bg); border-bottom-left-radius: 4px; }
.msg.user { align-self: flex-end; background: var(--accent-soft); border-bottom-right-radius: 4px; }
.msg .who { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
.msg .body p:last-child { margin-bottom: 0; } .msg .body p { margin: 0 0 .6em; }
.msg .body pre { background: rgba(0,0,0,.06); padding: 8px; border-radius: 6px; overflow-x: auto; font-size: 12.5px; }
.msg .decision { font-size: 13px; }
.msg .decision .kv { display: flex; gap: 6px; } .msg .decision .kv b { color: var(--muted); font-weight: 500; }
.qcard { margin: 0 12px 12px; padding: 14px; border: 1.5px solid var(--accent); border-radius: var(--radius); background: var(--panel); box-shadow: var(--shadow); flex: none; }
.qcard .lbl { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); font-weight: 700; margin-bottom: 6px; }
.qcard .prompt { font-size: 14.5px; margin-bottom: 10px; } .qcard .prompt p { margin: 0 0 .5em; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.opt { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; font-size: 13.5px; }
.opt.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.field { margin-bottom: 10px; }
.field label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
textarea, input[type=text], select { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); resize: vertical; }
textarea:focus, input:focus, select:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
.btn { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; font-weight: 600; font-size: 13.5px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.small { padding: 4px 9px; font-size: 12px; font-weight: 500; }
.btn.danger { color: var(--major); }
.btn:disabled { opacity: .5; cursor: default; }
.row { display: flex; gap: 8px; align-items: center; }
.row.end { justify-content: flex-end; }
.hint { font-size: 12px; color: var(--muted); }
.composer { border-top: 1px solid var(--line); padding: 10px 12px; flex: none; }
.composer textarea { min-height: 58px; margin-bottom: 6px; }
.banner { margin: 0 12px 12px; padding: 10px 12px; border-radius: 8px; background: var(--minor-soft); color: var(--minor); font-size: 13px; flex: none; }
.banner a { color: inherit; font-weight: 600; cursor: pointer; }
.issues-wrap { flex: 1; overflow-y: auto; padding: 12px; }
.iform { padding: 12px; border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 14px; background: var(--bg); }
.iform .row select { width: auto; }
.issue { padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 8px; background: var(--panel); font-size: 13.5px; }
.issue .top { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; font-size: 12px; color: var(--muted); }
.issue .top .sev { font-weight: 700; padding: 1px 7px; border-radius: 999px; }
.issue .top .sev.major { background: var(--major-soft); color: var(--major); }
.issue .top .sev.minor { background: var(--minor-soft); color: var(--minor); }
.issue .top .sp { flex: 1; }
.issue .txt { white-space: pre-wrap; }
.issue .actions { margin-top: 6px; display: flex; gap: 6px; }
.filter { display: flex; gap: 6px; margin-bottom: 10px; }
.lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; align-items: center; justify-content: center; z-index: 50; cursor: zoom-out; padding: 20px; }
.lightbox.on { display: flex; }
.lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; background: #fff; border-radius: 6px; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 999px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 60; }
.toast.on { opacity: 1; }
.sec-select { display: none; width: 100%; margin-bottom: 12px; }
@media (max-width: 1180px) {
  .app { grid-template-columns: 200px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) minmax(0, 44vh); }
  .panel { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--line); }
  .content { padding: 20px; }
}
@media (max-width: 720px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .sidebar { display: none; }
  .sec-select { display: block; }
  .content { padding: 16px; }
  header .counts { display: none; }
}
</style>
</head>
<body>
<header>
  <h1 id="title">Paper Review</h1>
  <div class="counts" id="counts"></div>
  <span class="pill working" id="status"><span class="dot"></span><span id="status-text">Connecting…</span></span>
</header>
<div class="app">
  <aside class="sidebar">
    <h2>Sections</h2>
    <ul class="outline" id="outline"></ul>
  </aside>
  <main class="content" id="content"></main>
  <aside class="panel">
    <div class="tabs">
      <button id="tab-chat" class="active" onclick="showTab('chat')">Conversation</button>
      <button id="tab-issues" onclick="showTab('issues')">Issues <span id="issue-n"></span></button>
    </div>
    <div class="tab active" id="pane-chat">
      <div class="thread" id="thread"></div>
      <div id="banner"></div>
      <div id="qcard"></div>
      <div class="composer">
        <textarea id="composer" placeholder="Ask Claude about this section… (⌘/Ctrl+Enter to send)"></textarea>
        <div class="row end">
          <span class="hint" id="composer-hint">Messages go to Claude; it replies here.</span>
          <button class="btn primary" id="send" onclick="sendMessage()">Send</button>
        </div>
      </div>
    </div>
    <div class="tab" id="pane-issues">
      <div class="issues-wrap">
        <div class="iform" id="iform">
          <div class="row" style="margin-bottom:8px">
            <select id="i-sev"><option value="major">Major</option><option value="minor" selected>Minor</option></select>
            <input type="text" id="i-loc" placeholder="Location (e.g. para 2, Eq. 3, Fig. 1)">
          </div>
          <textarea id="i-text" placeholder="Describe the issue…" style="min-height:64px;margin-bottom:8px"></textarea>
          <div class="row end">
            <span class="hint">Logged for the current section; Claude sees it with your next reply.</span>
            <button class="btn primary" onclick="addIssue()">Log issue</button>
          </div>
        </div>
        <div class="filter">
          <button class="btn small" id="f-this" onclick="setFilter('this')">This section</button>
          <button class="btn small" id="f-all" onclick="setFilter('all')">All</button>
        </div>
        <div id="issues"></div>
      </div>
    </div>
  </aside>
</div>
<div class="lightbox" id="lightbox" onclick="this.classList.remove('on')"><img id="lightbox-img" alt=""></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
let state = null, version = 0, selected = null, filter = 'this', offline = false;
let renderedQuestion = null, lastSeenQuestion = null, lastSectionKey = null, lastThreadKey = null;
const MARKER_KIND = { 'G': 'G', 'C': 'C', '?': 'Q', 'REF?': 'REF', 'EQ?': 'EQ', 'REF': 'REF', 'EQ': 'EQ' };
const MARKER_LABEL = { G: 'grammar', C: 'clarity', Q: 'unsupported claim', REF: 'citation', EQ: 'verify equation' };
const MARKER_SEV = { G: 'minor', C: 'minor', Q: 'major', REF: 'major', EQ: 'major' };

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 1800); }
async function post(path, body) {
  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  return r.json();
}

// ---------- markdown + math + markers
const MARKER_RE = /\[(G|C|REF\?|EQ\?|\?|REF|EQ)(?::\s*([^\]]*))?\]/g;
function protectMath(md) {
  const slots = [];
  const keep = (m) => {                      // markers written inside math are hoisted out after it
    let tail = '';
    m = m.replace(MARKER_RE, (mk) => { tail += ' ' + mk; return ''; });
    slots.push(m); return `@@MATH${slots.length - 1}@@${tail}`;
  };
  md = md.replace(/\$\$[\s\S]+?\$\$/g, keep)
         .replace(/\\\[[\s\S]+?\\\]/g, keep)
         .replace(/\\\([\s\S]+?\\\)/g, keep)
         .replace(/(^|[^\\$])\$(?!\s)((?:\\.|[^$\n])+?)\$(?![\d$])/g, (m, pre, body) => pre + keep('$' + body + '$'));
  return { md, slots };
}
function restoreMath(html, slots) {
  return html.replace(/@@MATH(\d+)@@/g, (m, i) => esc(slots[+i]));
}
function markers(html) {
  html = html.replace(/\[(cite|ref|eqref|autoref|cref):\s*([^\]]*)\]/g, (m, k, v) => `<span class="ref" title="${k}">${k === 'cite' ? '📖' : '↗'} ${esc(v)}</span>`);
  return html.replace(/\[(G|C|REF\?|EQ\?|\?|REF|EQ)(?::\s*([^\]]*))?\]/g, (m, k, text) => {
    const kind = MARKER_KIND[k]; if (!kind) return m;
    const t = (text || '').trim();
    return `<span class="mk mk-${kind}" data-kind="${kind}" data-text="${esc(t)}" title="${MARKER_LABEL[kind]} — click to log as issue"><span class="k">${kind === 'Q' ? '?' : kind}</span>${esc(t)}</span>`;
  });
}
function fileUrl(src, base) {
  if (!src || /^(https?:|data:|\/|blob:)/i.test(src)) return src;
  return '/files/' + (base ? base.replace(/\/$/, '') + '/' : '') + src;
}
function renderMarkdown(md, base) {
  const { md: safe, slots } = protectMath(md || '');
  let html;
  try { html = window.marked ? marked.parse(safe, { mangle: false, headerIds: false }) : `<pre>${esc(safe)}</pre>`; }
  catch (e) { html = `<pre>${esc(safe)}</pre>`; }
  html = restoreMath(markers(html), slots);
  const div = document.createElement('div');
  div.innerHTML = html;
  div.querySelectorAll('img').forEach(img => { img.src = fileUrl(img.getAttribute('src'), base); img.addEventListener('click', () => openLightbox(img.src)); });
  div.querySelectorAll('a[href]').forEach(a => { if (!/^(https?:|mailto:|#)/i.test(a.getAttribute('href'))) a.href = fileUrl(a.getAttribute('href'), base); a.target = '_blank'; });
  if (window.renderMathInElement) {
    try { renderMathInElement(div, { delimiters: [{ left: '$$', right: '$$', display: true }, { left: '\\[', right: '\\]', display: true }, { left: '\\(', right: '\\)', display: false }, { left: '$', right: '$', display: false }], throwOnError: false, ignoredClasses: ['mk'] }); } catch (e) {}
  }
  return div;
}
function openLightbox(src) { $('lightbox-img').src = src; $('lightbox').classList.add('on'); }

// ---------- state polling
async function poll() {
  try {
    const r = await fetch(`/api/state?v=${version}&timeout=25`);
    if (!r.ok) throw new Error(r.status);
    const s = await r.json();
    offline = false;
    if (s.version !== version) { version = s.version; state = s; render(); } else { renderStatus(); }
  } catch (e) {
    offline = true; renderStatus();
    await new Promise(res => setTimeout(res, 2000));
  }
  poll();
}

// ---------- rendering
function sectionTitle(id) {
  if (!state) return id;
  if (state.sections[id]) return state.sections[id].title;
  const o = state.outline.find(o => o.id === id);
  return o ? o.title : (id || 'General');
}
function pendingQuestion() { return state ? [...state.questions].reverse().find(q => q.status === 'pending') : null; }
function issueCount(sid) { return state.issues.filter(i => i.section === sid).length; }

function render() {
  if (!state) return;
  const posted = Object.keys(state.sections);
  if (!selected || (!state.sections[selected] && !state.outline.find(o => o.id === selected))) selected = state.current || posted[0] || null;
  const q = pendingQuestion();
  if (q && q.id !== lastSeenQuestion) {          // a new question: jump to its section and the chat tab
    lastSeenQuestion = q.id; if (q.section) selected = q.section; showTab('chat'); notify(q);
  } else if (!q && state.current && state.current !== selected && state.sections[state.current] && state.sections[state.current].posted_at > (lastPostedAt || '')) {
    selected = state.current;
  }
  lastPostedAt = state.current && state.sections[state.current] ? state.sections[state.current].posted_at : lastPostedAt;
  document.title = (q ? '● ' : '') + (state.title || 'Paper Review');
  $('title').textContent = state.title || 'Paper Review';
  renderStatus(); renderCounts(); renderOutline(); renderSection(); renderThread(); renderQuestion(); renderIssues();
}
let lastPostedAt = null;

function renderStatus() {
  const el = $('status'), txt = $('status-text');
  el.className = 'pill';
  if (offline) { el.classList.add('offline'); txt.textContent = 'Server offline'; return; }
  if (!state) { el.classList.add('working'); txt.textContent = 'Connecting…'; return; }
  const q = pendingQuestion();
  if (q) { el.classList.add('waiting-you'); txt.textContent = 'Claude is waiting for your decision'; }
  else if (state.waiting) { el.classList.add('working'); txt.textContent = 'Claude is listening'; }
  else { el.classList.add('working'); txt.textContent = 'Claude is working…'; }
}
function renderCounts() {
  const maj = state.issues.filter(i => i.severity === 'major').length, min = state.issues.filter(i => i.severity === 'minor').length;
  $('counts').innerHTML = `<span class="chip major">${maj} major</span><span class="chip minor">${min} minor</span>`;
  $('issue-n').textContent = state.issues.length ? `(${state.issues.length})` : '';
}
function renderOutline() {
  const ul = $('outline'); ul.innerHTML = '';
  const seen = new Set();
  const items = [...state.outline];
  Object.values(state.sections).forEach(s => { if (!items.find(o => o.id === s.id)) items.push({ id: s.id, title: s.title, level: 1 }); });
  items.forEach((o, idx) => {
    if (seen.has(o.id)) return; seen.add(o.id);
    const sec = state.sections[o.id];
    const st = sec ? sec.status : 'pending';
    const li = document.createElement('li');
    li.className = `level-${o.level || 1} ${sec ? 'posted' : ''} ${o.id === selected ? 'selected' : ''} ${o.skip ? 'skip' : ''}`;
    const n = issueCount(o.id);
    li.innerHTML = `<span class="st ${st}"></span><span class="t">${esc(o.title)}</span>${n ? `<span class="badge ${state.issues.some(i => i.section === o.id && i.severity === 'major') ? 'has' : ''}">${n}</span>` : ''}`;
    li.title = sec ? `${o.title} — ${st}` : `${o.title} — not yet presented`;
    li.onclick = () => { selected = o.id; render(); };
    ul.appendChild(li);
  });
  if (!items.length) ul.innerHTML = '<li class="hint" style="cursor:default">No outline yet</li>';
}
function renderSection() {
  const c = $('content');
  const sec = selected ? state.sections[selected] : null;
  const key = sec ? `${sec.id}:${sec.posted_at}:${sec.markdown.length}` : `none:${selected}`;
  if (key === lastSectionKey) return;
  lastSectionKey = key;
  c.innerHTML = '';
  const sel = document.createElement('select'); sel.className = 'sec-select';
  const items = [...state.outline]; Object.values(state.sections).forEach(s => { if (!items.find(o => o.id === s.id)) items.push(s); });
  items.forEach(o => { const op = document.createElement('option'); op.value = o.id; op.textContent = o.title; op.selected = o.id === selected; sel.appendChild(op); });
  sel.onchange = () => { selected = sel.value; render(); };
  c.appendChild(sel);
  if (!sec) {
    const title = selected ? sectionTitle(selected) : null;
    c.insertAdjacentHTML('beforeend', `<div class="empty"><div class="big">📄</div>${title ? `<b>${esc(title)}</b><br>Claude has not presented this section yet.` : 'Waiting for Claude to post the first section…'}</div>`);
    return;
  }
  const head = document.createElement('div'); head.className = 'sec-head';
  head.innerHTML = `<h2>${esc(sec.title)}</h2>${sec.source ? `<span class="src">${esc(sec.source)}</span>` : ''}<span class="status">${sec.status === 'done' ? '✓ reviewed' : 'under review'}</span>`;
  c.appendChild(head);
  const legend = document.createElement('div'); legend.className = 'legend';
  legend.innerHTML = Object.entries(MARKER_LABEL).map(([k, v]) => `<span class="mk mk-${k}"><span class="k">${k === 'Q' ? '?' : k}</span>${v}</span>`).join('') + '<span>click a marker to log it as an issue</span>';
  c.appendChild(legend);
  const doc = renderMarkdown(sec.markdown, sec.base); doc.className = 'doc';
  const first = doc.firstElementChild;
  if (first && /^H[1-3]$/.test(first.tagName) && first.textContent.trim().toLowerCase() === sec.title.trim().toLowerCase()) first.remove();
  doc.querySelectorAll('.mk').forEach(m => m.addEventListener('click', () => prefillIssue(m.dataset.kind, m.dataset.text, sec)));
  c.appendChild(doc);
  const inline = new Set([...doc.querySelectorAll('img')].map(i => i.src));
  const extra = (sec.figures || []).filter(f => !inline.has(new URL(fileUrl(f.path, ''), location.href).href));
  if (extra.length) {
    const grid = document.createElement('div'); grid.className = 'figs';
    extra.forEach(f => {
      const url = fileUrl(f.path, '');
      const card = document.createElement('div'); card.className = 'fig';
      card.innerHTML = `<img src="${esc(url)}" alt="${esc(f.label || '')}" loading="lazy">`;
      const cap = renderMarkdown((f.label ? `**${f.label}** ` : '') + (f.caption || f.path), ''); cap.className = 'cap';
      card.appendChild(cap);
      card.querySelector('img').onclick = () => openLightbox(url);
      grid.appendChild(card);
    });
    c.appendChild(grid);
  }
}
function renderThread() {
  const th = $('thread');
  const msgs = state.messages.filter(m => m.section === selected || (!m.section && !selected));
  const key = selected + ':' + msgs.map(m => m.id).join(',');
  if (key === lastThreadKey) return;
  lastThreadKey = key;
  th.innerHTML = '';
  if (!msgs.length) th.innerHTML = `<div class="hint" style="text-align:center;padding:20px">No conversation on this section yet.</div>`;
  msgs.forEach(m => {
    const d = document.createElement('div'); d.className = `msg ${m.role}`;
    let body;
    if (m.kind === 'answer' && m.answer) {
      const a = m.answer; const parts = [];
      if (a.choices && a.choices.length) parts.push(`<div class="kv"><b>Choice:</b><span>${esc(a.choices.join(', '))}</span></div>`);
      else if (a.choice) parts.push(`<div class="kv"><b>Choice:</b><span>${esc(a.choice)}</span></div>`);
      if (a.values) Object.entries(a.values).forEach(([k, v]) => { if (v !== '' && v != null) parts.push(`<div class="kv"><b>${esc(k)}:</b><span>${esc(Array.isArray(v) ? v.join(', ') : v)}</span></div>`); });
      if (a.text) parts.push(`<div style="margin-top:4px;white-space:pre-wrap">${esc(a.text)}</div>`);
      body = `<div class="decision">${parts.join('') || '<i>submitted</i>'}</div>`;
      d.innerHTML = `<div class="who">You decided · ${esc(m.ts.slice(11, 16))}</div>${body}`;
    } else {
      d.innerHTML = `<div class="who">${m.role === 'user' ? 'You' : 'Claude'} · ${esc(m.ts.slice(11, 16))}</div>`;
      const b = renderMarkdown(m.text, ''); b.className = 'body'; d.appendChild(b);
    }
    th.appendChild(d);
  });
  th.scrollTop = th.scrollHeight;
}
function renderQuestion() {
  const q = pendingQuestion();
  const banner = $('banner'), card = $('qcard');
  banner.innerHTML = '';
  if (!q) { card.innerHTML = ''; renderedQuestion = null; return; }
  if (q.section && q.section !== selected) {
    banner.innerHTML = `<div class="banner">Claude is waiting on <a onclick="selected='${esc(q.section)}';render()">${esc(sectionTitle(q.section))}</a>.</div>`;
    card.innerHTML = ''; renderedQuestion = null; return;
  }
  if (renderedQuestion === q.id) return;
  renderedQuestion = q.id;
  const chosen = new Set();
  card.innerHTML = '';
  const el = document.createElement('div'); el.className = 'qcard';
  el.innerHTML = `<div class="lbl">Decision needed</div>`;
  const p = renderMarkdown(q.prompt, ''); p.className = 'prompt'; el.appendChild(p);
  if (q.options && q.options.length) {
    const opts = document.createElement('div'); opts.className = 'opts';
    q.options.forEach(o => {
      const b = document.createElement('button'); b.className = 'opt'; b.textContent = o;
      b.onclick = () => { if (q.multi) { chosen.has(o) ? chosen.delete(o) : chosen.add(o); } else { chosen.clear(); chosen.add(o); } opts.querySelectorAll('.opt').forEach(x => x.classList.toggle('on', chosen.has(x.textContent))); };
      opts.appendChild(b);
    });
    el.appendChild(opts);
  }
  const fieldEls = {};
  (q.fields || []).forEach(f => {
    const w = document.createElement('div'); w.className = 'field';
    const id = `f-${q.id}-${f.id}`;
    let input;
    if (f.type === 'select') {
      input = document.createElement('select');
      (f.options || []).forEach(o => { const op = document.createElement('option'); op.value = o; op.textContent = o; input.appendChild(op); });
      if (f.multi) input.multiple = true;
    } else if (f.type === 'checkbox') {
      input = document.createElement('input'); input.type = 'checkbox'; input.style.width = 'auto';
    } else if (f.type === 'text') {
      input = document.createElement('input'); input.type = 'text';
    } else {
      input = document.createElement('textarea');
    }
    input.id = id; if (f.placeholder) input.placeholder = f.placeholder;
    w.innerHTML = `<label for="${id}">${esc(f.label || f.id)}${f.required ? ' *' : ''}</label>`;
    w.appendChild(input); el.appendChild(w); fieldEls[f.id] = { input, f };
  });
  let textEl = null;
  if (q.text_label) {
    const w = document.createElement('div'); w.className = 'field';
    w.innerHTML = `<label>${esc(q.text_label)}</label>`;
    textEl = document.createElement('textarea'); textEl.placeholder = 'Optional'; w.appendChild(textEl); el.appendChild(w);
  }
  const row = document.createElement('div'); row.className = 'row end';
  row.innerHTML = `<span class="hint">${q.options && q.options.length ? (q.multi ? 'Pick any that apply' : 'Pick one') : ''}</span>`;
  const submit = document.createElement('button'); submit.className = 'btn primary'; submit.textContent = 'Submit decision';
  submit.onclick = async () => {
    const answer = { choice: q.multi ? null : [...chosen][0] || null, choices: [...chosen], text: textEl ? textEl.value.trim() : '', values: {} };
    for (const [id, { input, f }] of Object.entries(fieldEls)) {
      let v;
      if (f.type === 'checkbox') v = input.checked;
      else if (f.type === 'select' && input.multiple) v = [...input.selectedOptions].map(o => o.value);
      else v = input.value.trim();
      if (f.required && (v === '' || (Array.isArray(v) && !v.length))) { toast(`"${f.label || id}" is required`); input.focus(); return; }
      answer.values[id] = v;
    }
    if (q.options && q.options.length && !chosen.size && !(textEl && answer.text) && !Object.keys(fieldEls).length) { toast('Pick an option or write something'); return; }
    submit.disabled = true;
    const summary = [answer.choice || answer.choices.join(', '), ...Object.entries(answer.values).map(([k, v]) => `${k}: ${Array.isArray(v) ? v.join(', ') : v}`), answer.text].filter(Boolean).join('\n');
    const r = await post('/api/user', { op: 'answer', question_id: q.id, answer, summary });
    if (!r.ok) { toast(r.error || 'Could not submit'); submit.disabled = false; }
  };
  row.appendChild(submit); el.appendChild(row);
  card.appendChild(el);
  if (textEl) textEl.focus();
}
function renderIssues() {
  $('f-this').classList.toggle('primary', filter === 'this'); $('f-all').classList.toggle('primary', filter === 'all');
  const list = $('issues'); list.innerHTML = '';
  const items = state.issues.filter(i => filter === 'all' || i.section === selected);
  if (!items.length) { list.innerHTML = `<div class="hint" style="text-align:center;padding:16px">No issues ${filter === 'this' ? 'on this section' : 'yet'}.</div>`; return; }
  [...items].reverse().forEach(i => {
    const d = document.createElement('div'); d.className = 'issue';
    d.innerHTML = `<div class="top"><span class="sev ${i.severity}">${i.severity}</span><span>${esc(sectionTitle(i.section))}${i.location ? ' · ' + esc(i.location) : ''}</span><span class="sp"></span><span>${i.source === 'user' ? 'you' : 'Claude'}</span></div><div class="txt">${esc(i.text)}</div><div class="actions"><button class="btn small" data-a="edit">Edit</button><button class="btn small danger" data-a="del">Delete</button></div>`;
    d.querySelector('[data-a=del]').onclick = async () => { if (confirm('Delete this issue?')) { await post('/api/user', { op: 'issue_delete', id: i.id }); } };
    d.querySelector('[data-a=edit]').onclick = () => editIssue(d, i);
    list.appendChild(d);
  });
}
function editIssue(container, i) {
  container.innerHTML = `<div class="row" style="margin-bottom:6px"><select id="e-sev"><option value="major" ${i.severity === 'major' ? 'selected' : ''}>Major</option><option value="minor" ${i.severity === 'minor' ? 'selected' : ''}>Minor</option></select><input type="text" id="e-loc" value="${esc(i.location)}" placeholder="Location"></div><textarea id="e-text" style="min-height:60px;margin-bottom:6px">${esc(i.text)}</textarea><div class="row end"><button class="btn small" id="e-cancel">Cancel</button><button class="btn small primary" id="e-save">Save</button></div>`;
  container.querySelector('#e-cancel').onclick = () => { renderIssues(); };
  container.querySelector('#e-save').onclick = async () => {
    await post('/api/user', { op: 'issue_update', id: i.id, severity: container.querySelector('#e-sev').value, location: container.querySelector('#e-loc').value.trim(), text: container.querySelector('#e-text').value.trim() });
    toast('Issue updated');
  };
}

// ---------- actions
function showTab(name) {
  ['chat', 'issues'].forEach(t => { $(`tab-${t}`).classList.toggle('active', t === name); $(`pane-${t}`).classList.toggle('active', t === name); });
}
function setFilter(f) { filter = f; renderIssues(); }
async function sendMessage() {
  const ta = $('composer'); const text = ta.value.trim();
  if (!text) return;
  $('send').disabled = true;
  const r = await post('/api/user', { op: 'message', section: selected, text });
  $('send').disabled = false;
  if (r.ok) { ta.value = ''; } else toast(r.error || 'Could not send');
}
async function addIssue() {
  const text = $('i-text').value.trim();
  if (!text) { toast('Describe the issue first'); $('i-text').focus(); return; }
  const r = await post('/api/user', { op: 'issue_add', severity: $('i-sev').value, location: $('i-loc').value.trim(), text, section: selected });
  if (r.ok) { $('i-text').value = ''; $('i-loc').value = ''; toast('Issue logged'); } else toast(r.error || 'Could not log');
}
function prefillIssue(kind, text, sec) {
  showTab('issues');
  $('i-sev').value = MARKER_SEV[kind] || 'minor';
  $('i-loc').value = '';
  $('i-text').value = `[${kind === 'Q' ? '?' : kind}] ${text || MARKER_LABEL[kind]}`;
  $('i-text').focus();
}
function notify(q) {
  if (document.visibilityState === 'visible') return;
  if ('Notification' in window && Notification.permission === 'granted') {
    try { new Notification('Claude is waiting for your decision', { body: (q.prompt || '').slice(0, 120) }); } catch (e) {}
  }
}
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
    if (document.activeElement === $('composer')) sendMessage();
    else if (document.activeElement === $('i-text')) addIssue();
    else { const b = document.querySelector('.qcard .btn.primary'); if (b) b.click(); }
  }
  if (e.key === 'Escape') $('lightbox').classList.remove('on');
});
document.addEventListener('click', () => { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); }, { once: true });
poll();
</script>
